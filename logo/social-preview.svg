<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <clipPath id="bite-cutout">
      <circle cx="640" cy="240" r="88"/>
    </clipPath>
    <linearGradient id="main-grad" x1="0.2" y1="0.2" x2="0.8" y2="0.8">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0D2E"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg-grad)"/>

  <!-- Subtle dot grid background -->
  <g fill="#312E81" opacity="0.15">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5"/>
    </pattern>
    <rect width="1280" height="640" fill="url(#dots)"/>
  </g>

  <!-- Logo: Bite Mark -->
  <g transform="translate(640,220)">
    <!-- Background circle -->
    <circle cx="0" cy="0" r="96" fill="none"/>

    <!-- Bold filled circle -->
    <circle cx="0" cy="0" r="72" fill="url(#main-grad)" opacity="0.95"/>

    <!-- Inner dot grid -->
    <g clip-path="url(#bite-cutout)">
      <circle cx="0" cy="0" r="84" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.2"/>

      <g fill="#E0E7FF" opacity="0.6">
        <circle cx="-28" cy="-28" r="4"/><circle cx="0" cy="-36" r="5"/><circle cx="28" cy="-28" r="4"/>
        <circle cx="-40" cy="0" r="4"/><circle cx="-12" cy="-4" r="6"/><circle cx="16" cy="-4" r="5"/><circle cx="40" cy="0" r="4"/>
        <circle cx="-28" cy="28" r="4"/><circle cx="0" cy="36" r="5"/><circle cx="28" cy="28" r="4"/>
      </g>

      <g stroke="#818CF8" stroke-width="1.2" fill="none" opacity="0.3">
        <line x1="-28" y1="-28" x2="0" y2="-36"/><line x1="0" y1="-36" x2="28" y2="-28"/>
        <line x1="-28" y1="-28" x2="-40" y2="0"/><line x1="28" y1="-28" x2="40" y2="0"/>
        <line x1="-40" y1="0" x2="-12" y2="-4"/><line x1="-12" y1="-4" x2="16" y2="-4"/>
        <line x1="16" y1="-4" x2="40" y2="0"/>
      </g>
    </g>

    <!-- The "bite" -->
    <circle cx="44" cy="-40" r="24" fill="#1E1B4B"/>
    <circle cx="44" cy="-40" r="24" fill="none" stroke="#818CF8" stroke-width="3" opacity="0.4"/>

    <!-- Blind spot dot -->
    <circle cx="44" cy="-40" r="5" fill="#F59E0B"/>
  </g>

  <!-- Project title -->
  <text x="640" y="380" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="700" fill="#E0E7FF" letter-spacing="2">Agent Handoff</text>

  <!-- Subtitle -->
  <text x="640" y="430" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="400" fill="#818CF8">File-based handoff protocol for multi-agent collaboration</text>

  <!-- Bottom line -->
  <line x1="540" y1="470" x2="740" y2="470" stroke="#4F46E5" stroke-width="1" opacity="0.5"/>
</svg>
