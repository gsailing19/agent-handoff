<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="bite-cutout">
      <circle cx="50" cy="50" r="44"/>
    </clipPath>
    <linearGradient id="main-grad" x1="0.2" y1="0.2" x2="0.8" y2="0.8">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#1E1B4B"/>

  <!-- Bold filled circle (the main body) -->
  <circle cx="50" cy="50" r="36" fill="url(#main-grad)" opacity="0.95"/>

  <!-- Inner dot grid visible through the cutout -->
  <g clip-path="url(#bite-cutout)">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#4F46E5" stroke-width="0.5" opacity="0.2"/>

    <!-- Dot matrix -->
    <g fill="#E0E7FF" opacity="0.6">
      <circle cx="36" cy="36" r="2"/>
      <circle cx="50" cy="32" r="2.5"/>
      <circle cx="64" cy="36" r="2"/>
      <circle cx="30" cy="50" r="2"/>
      <circle cx="44" cy="48" r="3"/>
      <circle cx="58" cy="48" r="2.5"/>
      <circle cx="70" cy="50" r="2"/>
      <circle cx="36" cy="64" r="2"/>
      <circle cx="50" cy="68" r="2.5"/>
      <circle cx="64" cy="64" r="2"/>
    </g>

    <!-- Connecting lines -->
    <g stroke="#818CF8" stroke-width="0.6" fill="none" opacity="0.3">
      <line x1="36" y1="36" x2="50" y2="32"/>
      <line x1="50" y1="32" x2="64" y2="36"/>
      <line x1="36" y1="36" x2="30" y2="50"/>
      <line x1="64" y1="36" x2="70" y2="50"/>
      <line x1="30" y1="50" x2="44" y2="48"/>
      <line x1="44" y1="48" x2="58" y2="48"/>
      <line x1="58" y1="48" x2="70" y2="50"/>
    </g>
  </g>

  <!-- The "bite" — negative space circle overlapping the edge -->
  <circle cx="72" cy="30" r="12" fill="#1E1B4B"/>
  <circle cx="72" cy="30" r="12" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.4"/>

  <!-- Tiny dot inside the bite (the discovered blind spot) -->
  <circle cx="72" cy="30" r="2.5" fill="#F59E0B"/>
</svg>
